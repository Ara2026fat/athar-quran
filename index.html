<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1E6F5C">
<title>أثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--em:#1E6F5C;--cream:#F0E6D2;--gold:#F0A93B;--ink:#20342E;--soft:#7A6B55;
  --line:#3A2E24;--wood:#7A5334}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#07110D}
body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;background:#8FCDEA}
#stage{position:absolute;inset:0}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ── حياة ── */
@keyframes drift{to{transform:translateX(70px)}}
@keyframes sway{50%{transform:rotate(-2.3deg)}}
@keyframes swayT{50%{transform:rotate(-4.5deg)}}
@keyframes breathe{50%{transform:translateY(-2px)}}
@keyframes blinkA{0%,38%,100%{transform:scaleY(1)}40%{transform:scaleY(.08)}42%{transform:scaleY(1)}
  44.5%{transform:scaleY(.08)}46.5%{transform:scaleY(1)}88%{transform:scaleY(1)}90%{transform:scaleY(.08)}92%{transform:scaleY(1)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes sprout{from{transform:scale(0);opacity:0}}
@keyframes pulse{0%,100%{opacity:.18;r:var(--r)}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.9)}}
@keyframes nudge{25%{transform:translateX(9px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
@keyframes beckon{0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.04)}}
@keyframes beckGlow{0%,100%{box-shadow:0 5px 0 rgba(58,46,36,.25)}
  50%{box-shadow:0 5px 0 rgba(58,46,36,.25),0 0 0 8px rgba(240,169,59,.28)}}
.beckon{animation:beckon 1.5s ease-in-out infinite,beckGlow 1.5s ease-in-out infinite!important}
.plabel.beckon{animation:beckon 1.4s ease-in-out infinite!important}
@keyframes beck{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.cloud{animation:drift 50s linear infinite alternate}
.cloud.b{animation-duration:70s}
.palm{transform-origin:bottom center;animation:sway 6.8s ease-in-out infinite}
.palm.b{animation-duration:8.4s;animation-delay:-2s}
/* الشجرة ليست نخلة: حفيفٌ خفيف لا تمايل */
@keyframes rustle{50%{transform:rotate(-.9deg)}}
.tree-sway{transform-origin:bottom center;animation:rustle 7.5s ease-in-out infinite}
.tuft{transform-origin:bottom center;animation:swayT 4.6s ease-in-out infinite}
.tuft.d2{animation-duration:5.8s;animation-delay:-1.5s}
.star{animation:twinkle 3.4s ease-in-out infinite}
.stream{stroke-dasharray:14 9;animation:flow 1.4s linear infinite}
#eyes{transform-origin:30px 45px;animation:blinkA 7.6s ease-in-out infinite}
#abody{transform-origin:30px 151px;animation:breathe 3.7s ease-in-out infinite}
#sky2,#sky3,#night,#stars,#sun,#moon{transition:opacity 2.2s ease}

/* ── الأماكن ── */
.place{cursor:pointer;transition:filter .8s ease,opacity .8s ease}
.place.sleep{filter:saturate(.12) brightness(1.05);opacity:.62}
.place.visited{filter:none}
.halo{--r:0;stroke:#FFF3D0;stroke-width:0;fill:#FFF3D0;opacity:0}
.place.ready .halo{opacity:.2;animation:pulse 2.6s ease-in-out infinite}
#labels{position:absolute;inset:0;pointer-events:none;z-index:4}
.plabel{position:absolute;transform:translate(-50%,0);pointer-events:auto;cursor:pointer;
  background:linear-gradient(#FFFDF6,#F4E7CC);border:3px solid var(--line);border-radius:18px;
  padding:6px 14px;font-size:15px;font-weight:500;white-space:nowrap;
  box-shadow:0 4px 0 rgba(58,46,36,.25)}
.plabel.ready{animation:beck 2.2s ease-in-out infinite}
.plabel.done{background:linear-gradient(#DFF0D4,#C3E3AF);border-color:#4E9E63;box-shadow:0 4px 0 #3E7A4E}
.plabel.sleep{display:none}
.plabel:active{transform:translate(-50%,4px);box-shadow:none}

/* ── فقاعة أثر ── */
#say{position:absolute;inset-inline:0;z-index:6;opacity:0;transform:translateY(8px);
  transition:opacity .34s,transform .34s;display:flex;flex-direction:column;align-items:center;
  padding-inline:14px;pointer-events:none}
#say.on{opacity:1;transform:none}
#say .b{background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 18px;
  font-size:18px;font-weight:500;max-width:88%;text-align:center;box-shadow:0 5px 0 rgba(58,46,36,.2)}
#say .t{width:15px;height:15px;background:#fff;border:3px solid var(--line);border-top:0;
  border-inline-end:0;transform:rotate(-45deg);margin:-10px auto 0}

/* ── لوح التجربة ── */
#panel{position:absolute;inset-inline:0;bottom:0;z-index:10;padding:0 8px 8px;
  transform:translateY(104%);transition:transform .58s cubic-bezier(.3,1.05,.4,1)}
#panel.up{transform:none}
.sheet{position:relative;
  background:repeating-linear-gradient(90deg,rgba(140,100,60,.04) 0 3px,transparent 3px 10px),
    linear-gradient(#FDF7E8,#F2E3C6);
  border:4px solid var(--wood);border-bottom-width:6px;border-radius:30px 30px 22px 22px;
  padding:16px 15px 13px;box-shadow:0 -5px 0 rgba(58,46,36,.2),inset 0 2px 0 rgba(255,255,255,.8)}
.sheet::before{content:"";position:absolute;top:-4px;inset-inline:37%;height:18px;
  border:4px solid var(--wood);border-bottom:0;border-radius:18px 18px 0 0;background:#FDF7E8}
.stage{max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.beat{animation:rise .45s cubic-bezier(.3,1.3,.5,1)}
.ask{font-size:17px;font-weight:500;line-height:1.6;text-align:center;margin-bottom:12px}
.line{font-size:18px;line-height:1.8;text-align:center;padding:6px 0 4px}
.hint{font-size:14.5px;color:var(--soft);text-align:center;margin-top:8px;min-height:20px}

/* كل نصّ مسموع */
.readable{position:relative;padding-inline-start:30px!important}
.ear{position:absolute;top:6px;inset-inline-start:6px;width:22px;height:22px;border-radius:50%;
  background:var(--gold);display:grid;place-items:center;font-size:11px;box-shadow:0 2px 0 #B87A19}

.touchers{display:flex;gap:9px;justify-content:center}
.toucher{flex:1;border:3.5px solid var(--wood);border-radius:22px;
  background:radial-gradient(120% 90% at 30% 16%,#fff 0 20%,#E2F3FA 58%,#BFE5F3 100%);
  padding:11px 4px 9px;cursor:pointer;box-shadow:0 5px 0 #5E3E26;font:inherit}
.toucher .ico{font-size:22px;display:block}
.toucher b{display:block;font-size:14.5px;font-weight:500;margin-top:2px}
.toucher:active{transform:translateY(5px);box-shadow:none}
.toucher.seen{filter:saturate(.3);opacity:.7}
.reveal{background:linear-gradient(#fff,#FBF3E2);border:3.5px solid var(--wood);border-radius:20px;
  padding:13px 15px;margin-top:11px;font-size:16px;line-height:1.8;animation:rise .4s}

.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.slot{display:flex;align-items:center;gap:10px;background:linear-gradient(#E9F6DC,#D2EBBC);
  border:3px solid #57933F;border-radius:17px;padding:8px 12px;font-size:15px;animation:rise .4s}
.slot b{flex:0 0 22px;height:22px;border-radius:50%;background:#4E9E63;color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:700}
.pool{display:flex;flex-direction:column;gap:7px}
.chip{border:3.5px solid #8A7048;border-radius:19px;background:linear-gradient(#F6EEDA,#E2D3B2);
  padding:11px 14px;font:inherit;font-size:15px;color:var(--ink);text-align:start;cursor:pointer;
  box-shadow:0 5px 0 #6B573A}
.chip:active{transform:translateY(5px);box-shadow:none}
.chip.nudge{animation:nudge .45s}

.situation{background:#fff;border-radius:18px;padding:13px 15px;font-size:16px;
  border-inline-start:5px solid var(--gold);margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{border:3.5px solid var(--line);border-radius:20px;background:#fff;padding:13px 15px;
  font:inherit;font-size:16.5px;color:var(--ink);text-align:start;cursor:pointer;
  box-shadow:0 5px 0 rgba(58,46,36,.25)}
.opt:active{transform:translateY(5px);box-shadow:none}
.opt.picked{border-color:#2C90C4;background:#E6F5FC}
.outcome{border-radius:18px;padding:13px 15px;margin-top:11px;font-size:16px;line-height:1.8;animation:rise .4s}
.outcome.good{background:#DFF0D4;border-inline-start:5px solid #4E9E63}
.outcome.rethink{background:#FBEBD4;border-inline-start:5px solid var(--gold)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{border:3.5px solid var(--wood);border-radius:18px;background:linear-gradient(#F8F1E0,#EADCC0);
  padding:11px 8px;font:inherit;font-size:14.5px;cursor:pointer;box-shadow:0 5px 0 #5E3E26;color:var(--ink)}
.cell.seen{background:#E7E0D2;color:#9A8E78;box-shadow:0 5px 0 #A99880}

.srccard{background:linear-gradient(#FFFDF4,#F6EEDC);border:3.5px solid var(--wood);
  border-radius:20px;padding:14px 15px;font-size:16.5px;line-height:1.9;text-align:center}
.srccard .ref{display:block;font-size:13px;color:#8A7A5E;margin-top:7px}
.mission{background:linear-gradient(#FBEBD4,#F4DCB4);border:3.5px solid var(--wood);
  border-radius:22px;padding:16px;text-align:center;font-size:17.5px;line-height:1.8}
.mission .who{font-size:13.5px;color:var(--soft);margin-top:9px}

.btn{width:100%;margin-top:11px;padding:14px;border:3.5px solid var(--line);border-radius:20px;
  background:linear-gradient(#2A8067,#186352);color:#fff;font:inherit;font-size:18px;font-weight:500;
  cursor:pointer;box-shadow:0 5px 0 var(--line)}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn.gold{background:linear-gradient(#F7BC5C,#E8992B);color:#3A2E24}
.btn.off,.btn:disabled{background:linear-gradient(#D6CDBA,#C2B7A0);box-shadow:0 5px 0 #9C907A;
  border-color:#9C907A;cursor:default}
.ghost{width:100%;margin-top:6px;padding:10px;border:0;background:none;font:inherit;
  font-size:15px;color:var(--soft);cursor:pointer;text-decoration:underline}


.story{cursor:pointer}
.panel-art{height:32vh;max-height:230px;display:grid;place-items:center;
  background:linear-gradient(#EAF4FB,#F8EEDA);border:3.5px solid var(--wood);
  border-radius:22px;overflow:hidden;animation:rise .5s}
.panel-art svg{width:100%;height:100%;display:block}
.panel-cap{font-size:17px;line-height:1.8;text-align:center;margin-top:11px;padding:6px 0}
.panel-dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.pdot{width:8px;height:8px;border-radius:50%;background:#DCCDAE;transition:all .3s}
.pdot.on{background:var(--em);transform:scale(1.3)}

.bism{text-align:center;font-size:17px;color:#8A7A5E;margin:4px 0 12px}
.ayat{display:flex;flex-direction:column;gap:8px}
.ayah{display:flex;gap:10px;align-items:flex-start;cursor:pointer;
  background:linear-gradient(#FFFDF4,#F7EEDA);border:3.5px solid #C9A24A;border-radius:20px;
  padding:13px 14px;box-shadow:0 4px 0 #A9832F;transition:transform .12s,box-shadow .12s}
.ayah:active{transform:translateY(4px);box-shadow:none}
.ayah .num{flex:0 0 24px;height:24px;border-radius:50%;background:#C9A24A;color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:700}
.ayah .txt{flex:1;font-size:19px;line-height:2;font-weight:500}
.ayah.now{border-color:#2A8067;box-shadow:0 4px 0 #186352,0 0 0 5px rgba(42,128,103,.18)}
.ayah.seen .num{background:#4E9E63}
.ayah.await::after{content:"🎧";font-size:13px;opacity:.5;align-self:center}

.lcard{border-radius:24px;padding:18px 16px;text-align:center;animation:rise .5s}
.lcard.start{background:linear-gradient(#EAF6EF,#D6EBDD);border:3.5px solid #2A8067}
.lcard.end{background:linear-gradient(#FFF8E8,#F6E8C8);border:3.5px solid var(--wood)}
.ltag{display:inline-block;background:#2A8067;color:#fff;font-size:12.5px;font-weight:700;
  padding:4px 14px;border-radius:12px;margin-bottom:9px}
.ltag.done{background:var(--gold);color:#3A2E24}
.lcard h2{font-size:22px;font-weight:700;margin-bottom:7px}
.lgoal{font-size:17.5px;line-height:1.75}
.lsrc{font-size:12.5px;color:#7A8C82;margin-top:10px}
.lsum{background:#fff;border-radius:16px;padding:12px 14px;margin-top:6px;text-align:start}
.lsum b{display:block;font-size:14px;color:var(--em);margin-bottom:6px}
.lsum ul{padding-inline-start:20px;font-size:15.5px;line-height:1.9}
.lmission{background:#FBEBD4;border-radius:16px;padding:11px 14px;margin-top:9px;text-align:start}
.lmission b{display:block;font-size:14px;color:#B87A19;margin-bottom:4px}
.lmission p{font-size:15.5px;line-height:1.7}
.lmark{margin-top:9px;font-size:14px;color:var(--soft)}
.lmark.on{color:#2F6B3E;font-weight:500}
.lparent{background:#EEF1F5;border-radius:16px;padding:10px 13px;margin-top:9px;text-align:start}
.ltags{display:flex;gap:6px;margin-bottom:5px}
.ltags span{font-size:11.5px;background:#DCE3EA;color:#4A5A68;padding:2px 9px;border-radius:9px}
.lparent b{display:block;font-size:12.5px;color:#5E6E80;margin-bottom:3px}
.lparent p{font-size:14px;color:#54626F;line-height:1.7}

.tadabbur{padding:26px 8px;opacity:0;transition:opacity 1.4s ease}
.tadabbur.in{opacity:1}
.tline{font-size:21px;line-height:2.1;text-align:center;color:#1E4A3C;font-weight:500;
  padding:18px 14px;background:radial-gradient(120% 100% at 50% 0,#F2F8F4,#E6F0E9);
  border-radius:24px;border:3px solid #BBD8C8}
.btn.quiet{opacity:0;transition:opacity 1s ease;background:linear-gradient(#5E8C7B,#3D6B5A);
  box-shadow:0 5px 0 #2A4E41;border-color:#2A4E41;animation:none}
.btn.quiet.in{opacity:1}
.lheart{background:#EAF3EE;border-radius:16px;padding:10px 13px;margin-top:9px;text-align:start}
.lheart b{display:block;font-size:12.5px;color:#2A8067;margin-bottom:3px}
.lheart p{font-size:14.5px;color:#39584B;line-height:1.75}

#daily{position:absolute;inset:0;z-index:16;display:none;align-items:flex-end;
  justify-content:center;padding:0 12px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent 55%,rgba(13,26,20,.45))}
#daily.on{display:flex;animation:rise .55s ease-out}
.dcard{width:100%;max-width:440px;background:linear-gradient(#FFF8E8,#F6E8C8);
  border:4px solid var(--wood);border-radius:24px;padding:15px 16px 13px;text-align:center;
  box-shadow:0 6px 0 rgba(58,46,36,.3)}
.dcard.done{background:linear-gradient(#EAF6EF,#D6EBDD);border-color:#2A8067}
.dtag{display:inline-block;background:var(--gold);color:#3A2E24;font-size:12.5px;font-weight:700;
  padding:3px 13px;border-radius:11px;margin-bottom:8px}
.dcard.done .dtag{background:#2A8067;color:#fff}
.dcard p{font-size:17.5px;line-height:1.8}
.dnote{font-size:14px;color:#2F6B3E;margin-top:8px;font-weight:500}
.dbtn{width:100%;margin-top:11px;padding:13px;border:3.5px solid var(--line);border-radius:18px;
  background:linear-gradient(#F7BC5C,#E8992B);color:#3A2E24;font:inherit;font-size:18px;
  font-weight:500;cursor:pointer;box-shadow:0 5px 0 #B87A19}
.dbtn:active{transform:translateY(5px);box-shadow:none}

#myv{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:60px;z-index:9;
  width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:rgba(255,255,255,.9);
  cursor:pointer;font-size:17px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(58,46,36,.3)}
#sett{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:110px;z-index:9;
  width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:rgba(255,255,255,.9);
  cursor:pointer;color:var(--line);display:grid;place-items:center;box-shadow:0 3px 0 rgba(58,46,36,.3)}
#valley{position:absolute;inset:0;z-index:18;display:none;align-items:center;justify-content:center;
  padding:20px 12px;background:radial-gradient(120% 90% at 50% 40%,rgba(13,26,20,.5),rgba(13,26,20,.82));
  backdrop-filter:blur(3px)}
#valley.on{display:flex;animation:rise .5s ease-out}
.vcard{width:100%;max-width:430px;background:linear-gradient(#FDF7E8,#F2E3C6);border:4px solid var(--wood);
  border-radius:26px;padding:17px 16px 14px;box-shadow:0 8px 0 rgba(0,0,0,.3);
  max-height:82vh;display:flex;flex-direction:column}
.vtag{align-self:center;background:#2A8067;color:#fff;font-size:13px;font-weight:700;
  padding:4px 16px;border-radius:12px}
.vlead{text-align:center;font-size:18px;font-weight:500;margin:9px 0 11px}
.vlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  background:#fff;border-radius:12px;padding:9px 12px}
.vrow b{font-size:15.5px;font-weight:500;color:#2F6B3E}
.vrow i{font-style:normal;font-size:12.5px;color:var(--soft);white-space:nowrap}
.vempty{text-align:center;color:var(--soft);font-size:15px;padding:18px}
.vkept{text-align:center;font-size:14.5px;color:#B87A19;margin-top:10px;font-weight:500}
.vrest{text-align:center;font-size:14px;color:var(--soft);margin-top:4px}
.vbtn{margin-top:12px;padding:13px;border:3.5px solid var(--line);border-radius:18px;
  background:linear-gradient(#2A8067,#186352);color:#fff;font:inherit;font-size:17px;
  font-weight:500;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.vbtn:active{transform:translateY(5px);box-shadow:none}

#nextup{position:absolute;inset:0;z-index:17;display:none;align-items:flex-end;justify-content:center;
  padding:0 12px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent 45%,rgba(13,26,20,.5))}
#nextup.on{display:flex;animation:rise .5s ease-out}
.ncard{width:100%;max-width:440px;background:linear-gradient(#FDF7E8,#F2E3C6);
  border:4px solid var(--wood);border-radius:26px;padding:15px 16px 13px;text-align:center;
  box-shadow:0 6px 0 rgba(58,46,36,.32)}
.ncard.done{background:linear-gradient(#EAF6EF,#D6EBDD);border-color:#2A8067}
.ntag{display:inline-block;background:var(--em);color:#fff;font-size:12.5px;font-weight:700;
  padding:3px 14px;border-radius:11px;margin-bottom:8px}
.ncard h3{font-size:22px;font-weight:700}
.nwhere{font-size:13.5px;color:var(--soft);margin-bottom:7px}
.ngoal{font-size:16.5px;line-height:1.75}
.nleft{font-size:13.5px;color:#B87A19;margin-top:9px;font-weight:500}
.nbtn{width:100%;margin-top:11px;padding:14px;border:3.5px solid var(--line);border-radius:19px;
  background:linear-gradient(#2A8067,#186352);color:#fff;font:inherit;font-size:18px;
  font-weight:500;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.nbtn:active{transform:translateY(5px);box-shadow:none}
.nghost{width:100%;margin-top:6px;padding:9px;border:0;background:none;font:inherit;
  font-size:14.5px;color:var(--soft);cursor:pointer;text-decoration:underline}

#parent{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  padding:20px 12px;background:radial-gradient(120% 90% at 50% 40%,rgba(13,26,20,.55),rgba(13,26,20,.85));
  backdrop-filter:blur(3px)}
#parent.on{display:flex;animation:rise .5s ease-out}
#settings{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  padding:20px 12px;background:radial-gradient(120% 90% at 50% 40%,rgba(13,26,20,.55),rgba(13,26,20,.85));
  backdrop-filter:blur(3px)}
#settings.on{display:flex;animation:rise .5s ease-out}
.srow{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;
  padding:12px 14px;margin-bottom:8px;font-size:15.5px;cursor:pointer;border:none;font:inherit;
  color:var(--em);text-align:right}
.srow .sic{font-size:20px}
.pcard{width:100%;max-width:440px;background:linear-gradient(#FDF7E8,#F2E3C6);border:4px solid var(--wood);
  border-radius:26px;padding:18px 17px 15px;box-shadow:0 8px 0 rgba(0,0,0,.3);
  max-height:86vh;overflow-y:auto}
.ptag{align-self:center;display:inline-block;background:#2A8067;color:#fff;font-size:13px;font-weight:700;
  padding:4px 16px;border-radius:12px;margin-bottom:10px}
.pgate{text-align:center}
.pgate h3{font-size:20px;margin:34px 0 16px;color:var(--em)}
.pinput{width:100%;padding:14px;border:3px solid #DCCDAE;border-radius:14px;font:inherit;
  font-size:22px;text-align:center;margin-bottom:12px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pstat{background:#fff;border-radius:14px;padding:10px 6px;text-align:center}
.pstat b{display:block;font-size:19px;color:#2F6B3E}
.pstat span{font-size:11px;color:var(--soft)}
.psec{background:#fff;border-radius:14px;padding:12px 13px;margin-bottom:10px}
.psec h4{font-size:14.5px;margin-bottom:8px;color:var(--em)}
.prow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px;
  border-bottom:1px solid #F0E4C8}
.prow:last-child{border-bottom:none}
.prow i{font-style:normal;color:var(--soft);font-size:12px;white-space:nowrap}
.pempty{color:var(--soft);font-size:13.5px;text-align:center;padding:6px 0}
.preport{white-space:pre-wrap;font-size:13px;line-height:1.8;background:#FBF3DD;border-radius:10px;
  padding:10px;margin-bottom:8px}
.pbtn{width:100%;padding:13px;border:3.5px solid var(--line);border-radius:16px;
  background:linear-gradient(#2A8067,#186352);color:#fff;font:inherit;font-size:15.5px;
  font-weight:500;cursor:pointer;box-shadow:0 5px 0 var(--line);margin-top:4px}
.pbtn:active{transform:translateY(4px);box-shadow:none}
.pbtn.ghost{background:none;color:var(--soft);box-shadow:none;border-color:#DCCDAE;text-decoration:underline}
.pbtn.danger{background:linear-gradient(#D9382C,#A82A20);box-shadow:0 5px 0 #7A1E17}

#ubar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:60;background:linear-gradient(#FDF7E8,#F2E3C6);border:3.5px solid var(--wood);
  border-radius:18px;padding:12px 14px;box-shadow:0 8px 20px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink);
  animation:rise .4s ease-out}
#ubar[hidden]{display:none}
#ubar b{display:block;margin-bottom:2px;color:var(--em)}
#ubar span{flex:1;min-width:160px;line-height:1.5}
#ubar button{border:2.5px solid var(--line);border-radius:12px;padding:8px 16px;font:inherit;
  font-size:13.5px;font-weight:500;cursor:pointer;background:linear-gradient(#2A8067,#186352);
  color:#fff;box-shadow:0 3px 0 var(--line)}
#ubar button:active{transform:translateY(3px);box-shadow:none}
#ubar button.ghost{background:none;color:var(--soft);box-shadow:none;border-color:#DCCDAE}

#intro{position:absolute;inset:0;z-index:19;display:none;align-items:center;justify-content:center;
  padding:20px 14px;background:radial-gradient(120% 90% at 50% 40%,rgba(13,26,20,.55),rgba(13,26,20,.85))}
#intro.on{display:flex;animation:rise .5s ease-out}
.icard{width:100%;max-width:400px;background:linear-gradient(#FDF7E8,#F2E3C6);
  border:4px solid var(--wood);border-radius:28px;padding:20px 18px 16px;text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.32)}
.idots{display:flex;gap:7px;justify-content:center;margin-bottom:13px}
.idots i{width:9px;height:9px;border-radius:50%;background:#DCCDAE;transition:all .3s}
.idots i.on{background:var(--em);width:22px;border-radius:5px}
.icard h3{font-size:24px;font-weight:700;color:var(--em);margin-bottom:7px}
.icard p{font-size:17px;line-height:1.85}
.ibtn{width:100%;margin-top:15px;padding:14px;border:3.5px solid var(--line);border-radius:19px;
  background:linear-gradient(#F7BC5C,#E8992B);color:#3A2E24;font:inherit;font-size:18px;
  font-weight:500;cursor:pointer;box-shadow:0 5px 0 #B87A19}
.ibtn:active{transform:translateY(5px);box-shadow:none}
#snd{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:10px;z-index:9;
  width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:rgba(255,255,255,.9);
  cursor:pointer;font-size:17px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(58,46,36,.3)}

#gate{position:absolute;inset:0;z-index:30;display:grid;place-items:center;text-align:center;
  padding:30px;background:linear-gradient(180deg,#8FCDEA 0%,#CDE8B8 42%,#2F6B3F 78%,#12271A 100%);color:#fff}
#gate img{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 26px rgba(0,0,0,.35);
  border:3px solid rgba(255,255,255,.55);margin-bottom:16px}
#gate h1{font-size:52px;font-weight:700;color:#FDF3D8;letter-spacing:-2px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
#gate p{font-size:17px;opacity:.85;margin-top:4px}
#gate button{margin-top:28px;padding:16px 44px;border:3.5px solid #0C3325;border-radius:24px;
  background:linear-gradient(#3BAA8B,#1E6F5C);color:#fff;font:inherit;font-size:21px;font-weight:500;
  cursor:pointer;box-shadow:0 6px 0 #0C3325}
#gate button:active{transform:translateY(6px);box-shadow:none}
#gate.off{opacity:0;pointer-events:none;transition:opacity .8s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

/* ═══ أثر · اللغة ═══════════════════════════════════════════
   العربية هي اللغة الوحيدة المنفَّذة. البنية جاهزة لغيرها:
   لا نصّ ظاهر في الكود — كل نصّ إمّا مفتاح واجهة أو معرّف محتوى.
   ═════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

const LOCALES = {
  ar: {
    dir: "rtl", name: "العربية",
    ui: {
      "app.name": "أثر",
      "app.tagline": "تعلّم واترك أثرًا طيبًا",
      "app.vision": "بيئةٌ يحبّها الطفل، وتترك أثرًا في أعماقه",
      "app.enter": "ادخل عالمك",
      "app.resume": "أكمل",
      "world.back": "عُد إلى الوادي",
      "world.sleeping": "ينام الآن",
      "act.did": "فعلتُها!",
      "act.later": "لم أفعلها بعد",
      "act.byChild": "تؤكّدها بنفسك بعد أن تفعلها",
      "act.byParent": "يؤكّدها والدك بعد أن يراك",
      "next": "تابع",
      "listen": "استمع"
    }
  }
};

const I18n = {
  cur: "ar",
  get locale() { return LOCALES[this.cur]; },
  t(key) { return (LOCALES[this.cur].ui[key]) || key; },
  /* نصّ المحتوى: { ar: "…" } — يسقط إلى العربية دائمًا */
  txt(node) {
    if (node == null) return "";
    if (typeof node === "string") return node;
    return node[this.cur] || node.ar || "";
  },
  apply() {
    document.documentElement.lang = this.cur;
    document.documentElement.dir = LOCALES[this.cur].dir;
  }
};

root.I18n = I18n;
})(window);

/* ── core/state.js ── */
/* ═══ أثر · الحالة ══════════════════════════════════════════
   ليست نقاطًا ولا مستويات. هي سجلّ ما فعله الطفل
   وما تركه من أثر في عالمه.
   ═════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

const KEY = "athar.world.v2";

const State = {
  data: {
    name: null,
    visited: {},     // expId → عدد المرّات
    learned: [],     // تجارب أُتمّت
    acts: [],        // مهام واقعية أُكِّدت — هذه وحدها تصنع الأثر
    marks: [],       // آثار ظاهرة في العالم
    depth: {},       // كم مرّة كُرّرت مهمّة كل درس — الأثر يعمق بالتكرار
    daily: null,     // { date, exp, done }
    phase: 0,        // وقت اليوم
    learnedAt: {},   // expId → أوّل تاريخ إتمام (للوحة الوالد)
    actAt: {},       // expId → آخر تاريخ تطبيق واقعي (للوحة الوالد)
    streak: 0,       // أيّام الاستمرارية المتتالية
    lastActive: null // آخر يومٍ حدث فيه نشاط (تعلّم أو تطبيق)
  },

  load() {
    try { Object.assign(this.data, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
    return this;
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch {} },
  reset() { try { localStorage.removeItem(KEY); } catch {} },

  visit(id) { this.data.visited[id] = (this.data.visited[id] || 0) + 1; this.save(); },
  isLearned(id) { return this.data.learned.includes(id); },
  learn(id) {
    if (!this.isLearned(id)) {
      this.data.learned.push(id);
      this.data.learnedAt[id] = Date.now();
    }
    this.bumpStreak();
    this.save();
  },

  /* المهمة الواقعية هي وحدها التي تترك أثرًا */
  act(id, mark) {
    if (!this.data.acts.includes(id)) this.data.acts.push(id);
    this.data.actAt[id] = Date.now();
    if (mark && !this.data.marks.includes(mark)) this.data.marks.push(mark);
    this.bumpStreak();
    this.save();
  },
  hasMark(m) { return this.data.marks.includes(m); },

  /* ─── استمرارية الوالد ───
     يوم واحد فيه تعلّمٌ أو تطبيق يكفي لبقاء السلسلة. */
  bumpStreak() {
    const y = this.today();
    if (this.data.lastActive === y) return;
    const prev = this.data.lastActive;
    const yestr = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    this.data.streak = (prev === yestr) ? (this.data.streak || 0) + 1 : 1;
    this.data.lastActive = y;
  },

  /* ─── مهمّة اليوم ───
     الأثر لا يُصنع مرّة. يوم يُعاد فيه الفعل أصدق من يومٍ يُتعلَّم فيه. */
  today() { return new Date().toISOString().slice(0, 10); },
  dailyFor(list) {
    const d = this.data.daily;
    if (d && d.date === this.today()) return d;
    if (!list.length) return null;
    /* يُختار الأقلّ تكرارًا، ثم يُثبَّت ليومه */
    const pick = list.slice().sort((a, b) =>
      (this.data.depth[a.id] || 0) - (this.data.depth[b.id] || 0))[0];
    this.data.daily = { date: this.today(), exp: pick.id, done: false };
    this.save();
    return this.data.daily;
  },
  dailyDone() {
    const d = this.data.daily;
    if (!d || d.done) return 0;
    d.done = true;
    this.data.depth[d.exp] = (this.data.depth[d.exp] || 0) + 1;
    this.save();
    return this.data.depth[d.exp];
  },
  depthOf(id) { return this.data.depth[id] || 0; },

  /* هل فُتح هذا المكان؟ يعتمد على متطلّباته لا على رقم */
  unlocked(reqs) {
    if (!reqs || !reqs.length) return true;
    return reqs.every(r => this.isLearned(r));
  },

  setPhase(p) { this.data.phase = p; this.save(); },

  /* المرحلة لا يختارها أحد — تُفتح حين يُتمّ الطفل مرحلته.
     التقدّم نموّ، لا اختيارًا من قائمة. */
  stage(all) {
    let s = 1;
    for (let n = 1; n <= 4; n++) {
      const ofStage = all.filter(e => e.stage === n);

function normalize(text, opts = {}) {
  let t = String(text)
    .replace(/[\u0640]/g, "")                 // تطويل
    .replace(/[«»]/g, "")                     // تنصيص عربي

    .replace(/\s+/g, " ").trim();

   نقطّع بأنفسنا ونضع صمتًا حقيقيًا بين المقاطع. */

    .split(/(?<=[،؛,\.\!\?؟:])\s*/)

const AR_GEMINI = {
  athar:    { v: "Leda",  s: "بصوت طفلٍ مرح ودود، متحمّس قليلًا" },
  narrator: { v: "Kore",  s: "بصوتٍ دافئ متمهّل، كمن يحكي لطفل" },
  sacred:   { v: "Charon", s: "بصوتٍ وقور متمهّل، مع وقفاتٍ واضحة" },
  friend:   { v: "Puck",  s: "بصوت طفلٍ ودود" }

function pcmToWav(b64, rate) {
  const bin = atob(b64), n = bin.length;
  const buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
  const put = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  put(0, "RIFF"); dv.setUint32(4, 36 + n, true); put(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  put(36, "data"); dv.setUint32(40, n, true);
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < n; i++) u8[44 + i] = bin.charCodeAt(i);
  let s = ""; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return "data:audio/wav;base64," + btoa(s);
}
function geminiTTS(key) {
  return async function (text, voice) {
    const g = AR_GEMINI[voice] || AR_GEMINI.narrator;
    const H = { "Content-Type": "application/json", "x-goog-api-key": key };
    const RATE = 24000;

    /* الواجهة الحديثة */
    try {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
        method: "POST", headers: H, body: JSON.stringify({
          model: "gemini-3.8-flash-tts",
          input: [{ type: "user_input", content: [{ type: "text", text,
            annotations: [{ type: "speech_metadata", style: g.s }] }] }],
          response_format: { type: "audio", mime_type: "audio/l16", sample_rate: RATE },
          generation_config: { speech_config: [{ voice: g.v }] }
        })
      });
      if (r.ok) {
        const j = await r.json();
        const b64 = findAudio(j);
        if (b64) return pcmToWav(b64, RATE);
      }
    } catch {}

    /* الواجهة السابقة — احتياطًا */
    const r2 = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent",
      { method: "POST", headers: H, body: JSON.stringify({
        contents: [{ parts: [{ text: g.s + ": " + text }] }],
        generationConfig: { responseModalities: ["AUDIO"],

      }) });

function findAudio(o, d) {
  d = d || 0;
  if (!o || typeof o !== "object" || d > 7) return null;
  if (typeof o.data === "string" && o.data.length > 200) return o.data;
  if (o.inlineData && typeof o.inlineData.data === "string") return o.inlineData.data;
  for (const k in o) { const h = findAudio(o[k], d + 1); if (h) return h; }
  return null;
}

        audioEncoding: "MP3",
        speakingRate: Math.max(.25, Math.min(4, (profile && profile.rate) || 1)),

/* ٣ · صوت الجهاز — احتياطي فقط، لا حلّ نهائي.

    /* لا نشترط صوتًا عربيًّا: بعض الأجهزة تنطق العربية بلا صوتٍ مُعلَن.

      const p = VOICES[e.voice] || VOICES.narrator;

        const txt = parts[i++];

        if (picked) u.voice = picked;

        u.onerror = next;

        const guard = setTimeout(() => {

          next();

        u.onstart = () => { misses = 0; clearTimeout(guard); };
        try { speechSynthesis.speak(u); } catch { clearTimeout(guard); next(); }
      };
      step();
    },
    stop() { cancelled = true; try { speechSynthesis.cancel(); } catch {} }
  };

  return {
    name: "silent", quality: "بلا صوت",
    available: () => true, canPlay: () => true,

    play(e, onEnd) { const ms = Math.min(7500, 900 + normalize(e.text).length * 78);

/* ── core/guide.js ── */
/* ═══ أثر · الإرشاد ═════════════════════════════════════════
   لا يُترك الطفل حائرًا. إن سكن، تدرّج العالم في تنبيهه:
     ٥ ثوانٍ  → ما يُلمس يتنفّس        (بصري صامت)
     ٩ ثوانٍ  → نغمة لطيفة              (سمعي بلا كلام)
    ١٤ ثانية → أثر يقول ماذا يفعل      (كلام قصير)
    ثم يعيدها كل ١٤ ثانية.
   أي لمسة تُعيد العدّ من الصفر.
   ═════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

const STEPS = [5000, 9000, 14000];

const Guide = {
  timers: [], scope: null, sel: null, hint: null, loop: null, _bound: null,

  /* ماذا يفعل الطفل الآن؟ */
  watch(scope, sel, hint) {
    this.clear();
    if (!scope) return;
    this.scope = scope; this.sel = sel; this.hint = hint;
    this.bind();
    this.arm();
  },

  arm() {
    this.timers = [
      setTimeout(() => this.level(1), STEPS[0]),
      setTimeout(() => this.level(2), STEPS[1]),
      setTimeout(() => this.level(3), STEPS[2])
    ];
  },

  bind() {
    if (this._bound) return;
    this._bound = () => this.reset();
    this.scope.addEventListener("pointerdown", this._bound, true);
  },

  reset() {
    this.timers.forEach(clearTimeout);
    clearInterval(this.loop); this.loop = null;
    this.dim();
    if (this.scope) this.arm();
  },

  targets() {
    if (!this.scope || !this.sel) return [];
    return [...this.scope.querySelectorAll(this.sel)]
      .filter(e => !e.disabled && !e.classList.contains("seen") && !e.classList.contains("done"));
  },

  level(n) {
    const t = this.targets();
    if (!t.length) return;
    if (n === 1) t.forEach(e => e.classList.add("beckon"));
    if (n === 2) root.AtharAudio.sfx("soft");
    if (n === 3) {
      this.speak();
      clearInterval(this.loop);
      this.loop = setInterval(() => this.targets().length ? this.speak() : this.clear(), STEPS[2]);
    }
  },

  speak() {
    if (!this.hint) return;
    root.World && root.World.athar(this.hint, "ask", 3000);
  },

  dim() { this.scope && this.scope.querySelectorAll(".beckon").forEach(e => e.classList.remove("beckon")); },

  clear() {
    this.timers.forEach(clearTimeout); this.timers = [];
    clearInterval(this.loop); this.loop = null;
    this.dim();
    if (this.scope && this._bound) this.scope.removeEventListener("pointerdown", this._bound, true);
    this._bound = null; this.scope = null; this.sel = null; this.hint = null;
  }
};

/* لكل وحدة تلميحها العام — يصلح لكل موضوع، فلا يُكتب في كل درس */
Guide.HINT = {
  touch:   "hint.touch",
  order:   "hint.order",
  pick:    "hint.pick",
  collect: "hint.collect",
  source:  "hint.next",
  narrate: "hint.next",
  act:     "hint.act",
  story:   "hint.story",
  recite:  "hint.recite",
  next:    "hint.next"
};

root.Guide = Guide;
})(window);

    if (this.i >= this.exp.beats.length) {
      State.learn(this.exp.id);
      return this.close(true);

    Guide.clear();
    const beat = this.exp.beats[this.i++];
    const fn = Blocks[beat.type];
    if (!fn) { console.warn("[director] وحدة غير معروفة:", beat.type); return this.step(); }
    fn(beat, this.stage, this.api());

        if (locked) b.disabled = true;
        b.onclick = () => { AtharAudio.sfx("tap"); D.scroll(); D.step(); box.classList.add("past"); D.stage.innerHTML = ""; };
        box.append(b);
        D.scroll();
      },
      ready(box) {
        const b = box.querySelector(".next");
        if (b && b.disabled) {
          b.disabled = false; b.classList.remove("off");
          AtharAudio.sfx("up");                       /* نغمة: انفتح الطريق */
          Guide.watch(D.stage, ".next", Guide.HINT.next);
        }
      },
      next(box) { return () => { D.stage.innerHTML = ""; D.step(); }; },
      athar: (audio, mood) => D.world.athar(audio, mood),
      effect: m => D.world.effect(m),
      act: mark => { State.act(D.exp.id, mark || D.exp.leaves); if (mark || D.exp.leaves) D.world.effect(mark || D.exp.leaves); },
      meter: v => D.world.meter(v),
      /* ماذا ينتظر الطفل أن يفعل الآن */
      guide: (sel, kind) => Guide.watch(D.stage, sel, Guide.HINT[kind] || kind)
    };
  },

  scroll() { requestAnimationFrame(() => { this.stage.scrollTop = this.stage.scrollHeight; }); }
};

const SPOT = { home:[160,520], spring:[140,560], road:[276,596], masjid:[254,398], hill:[104,418] };

const World = {
  root: null, say: null, places: [], onPick: null,

  mount(container, sayEl) {
    this.root = container; this.say = sayEl;
    container.innerHTML = SCENE;
    this.face("idle");
    return this;
  },

  /* ─── أماكن: نائمة حتى يحين دورها ─── */
  /* العالم لا يقرّر من يُفتح — يستقبل الحكم من طبقة التطبيق */
  render(places, onPick, ask) {
    this.places = places; this.onPick = onPick;
    places.forEach(p => {
      const g = this.root.querySelector(`.place[data-place="${p.place}"]`);
      if (!g) return;
      const st = ask(p);                     // { here, open, done }
      g.style.display = st.here ? "" : "none";
      g.classList.toggle("sleep", !st.open);
      g.classList.toggle("ready", st.open && !st.done);
      g.classList.toggle("visited", st.done);
      g.style.pointerEvents = (st.here && st.open) ? "auto" : "none";
      g.onclick = (st.here && st.open) ? () => onPick(p) : null;
    });
    this.applyMarks();
  },

  applyMarks() {
    ["mFruit","mFriend","mGreen","mWater","mLamp","mBeacon","mDoor","mMinaret","mHeart","mBirds","mRainbow","mHome","mNeighbor","mPath","mJug","mSteps","mCrescent","mChest","mLeaf","mSix","mBook","mNest","mBirdsFlock","mCompass","mMat","mCart","mArch","mSpring2","mRoad2","mCaravan","mBowl","mDates","mKaaba","mTwoTrees","mGem","mTorch","mSunrise","mVeil","mGlow","mMirror","mRope","mBell","mSapling","mLanterns","mScale","mKey","mGrain","mPurse","mStill","mHeartBig","mFeather","mQuiet","mPerfume","mWords","mOpenDoor","mHarvest","mHands","mScaleTrue","mShelter","mCrown","mBalance","mBlossom","mGreenDome","mPrism","mLampBook","mCalendar","mCoin","mSeven","mSeat","mTwoPaths","mWindmill","mLetters","mCave","mFiveLights","mGuard","mShield","mMinbar","mSeal","mClosedLips","mLowBranch","mEmber","mSunUp","mCurtain","mPulse","mCloak","mDawn","mCore","mCrack","mDust","mHouse2","mStarsFour","mFinalSeal","mBanner"].forEach(m =>
      this.el(m) && this.el(m).setAttribute("opacity", State.hasMark(m) ? "1" : "0"));
    if (State.hasMark("mLamp")) this.el("win").setAttribute("fill", "#FFD98A");
    /* عمق الآثار المحفوظ */
    Object.entries(State.data.depth || {}).forEach(([id, n]) => {
      const e = (root.App && root.App.exps && root.App.exps[id]) || null;
      if (e && e.leaves) this.deepen(e.leaves, n);
    });
  },

  el(id) { return this.root.querySelector("#" + id); },

  /* الأثر المتكرّر يزداد عمقًا: هالةٌ حوله تشتدّ */
  deepen(mark, level) {
    const g = this.el(mark);
    if (!g) return;
    g.style.filter = level >= 3 ? "drop-shadow(0 0 14px rgba(255,214,138,.95))"
                   : level === 2 ? "drop-shadow(0 0 9px rgba(255,214,138,.7))"
                   : level === 1 ? "drop-shadow(0 0 5px rgba(255,214,138,.5))" : "";
    g.style.animation = "sprout .8s cubic-bezier(.3,1.5,.5,1)";
  },

  /* ─── الأثر: تغيير دائم في العالم ─── */
  effect(mark) {
    if (!mark) return;
    const g = this.el(mark);
    if (!g) return;
    g.setAttribute("opacity", "1");
    g.style.animation = "sprout 1s cubic-bezier(.3,1.5,.5,1)";
    if (mark === "mLamp") this.el("win").setAttribute("fill", "#FFD98A");
    AtharAudio.sfx("up");
  },

  /* ─── وقت اليوم ─── */
  phase(p) {
    this.el("sky2").style.opacity = p >= 1 ? 1 : 0;
    this.el("sky3").style.opacity = p >= 2 ? 1 : 0;
    this.el("night").style.opacity = p >= 2 ? 1 : 0;
    this.el("stars").style.opacity = p >= 2 ? 1 : 0;
    this.el("sun").style.opacity = p >= 2 ? 0 : 1;
    this.el("moon").style.opacity = p >= 2 ? 1 : 0;
    State.setPhase(p);
  },

  /* ─── أثر ─── */
  face(k) { const f = FACE[k] || FACE.idle;
    this.el("brows").innerHTML = f.br; this.el("eyes").innerHTML = f.ey; this.el("mouth").innerHTML = f.mo; },

  moveTo(place) {
    const s = SPOT[place]; if (!s) return;
    const a = this.el("athar");
    a.style.transition = "transform 1.6s cubic-bezier(.34,.02,.32,1.04)";
    a.setAttribute("transform", `translate(${s[0]} ${s[1]}) scale(.78)`);
  },

  _t: null,
  athar(audioId, mood = "idle", ms = 2800) {
    const e = AtharAudio.entry(audioId) || { text: audioId };
    this.face(mood);
    const a = this.el("athar").getBoundingClientRect();
    const r = this.root.getBoundingClientRect();
    this.say.querySelector(".b").textContent = e.text;
    this.say.style.top = Math.max(60, a.top - r.top - 66) + "px";
    const cx = a.left - r.left + a.width / 2;
    this.say.style.transform = `translateX(${Math.max(-92, Math.min(92, cx - r.width / 2))}px)`;
    this.say.classList.add("on");
    AtharAudio.say(audioId);
    clearTimeout(this._t);
    this._t = setTimeout(() => { this.say.classList.remove("on"); this.face("idle"); }, ms);
  },
  hush() { this.say.classList.remove("on"); },
  meter() {}
};

(function (root) {

const App = {
  world: null, places: [], exps: {},

  boot(data) {
    I18n.apply();
    State.load();
    AtharAudio.configure({ manifest: data.audio, basePath: "audio/", sacredPolicy: "device-fallback" });
    this.places = data.world.places;
    this.exps = data.experiences;

    document.getElementById("brand").textContent = I18n.t("app.name");
    document.getElementById("tag").textContent = I18n.t("app.tagline");
    const btn = document.getElementById("enter");
    btn.textContent = State.data.learned.length ? I18n.t("app.resume") : I18n.t("app.enter");
    btn.onclick = () => this.enter();

    World.mount(document.getElementById("stage"), document.getElementById("say"));
    document.getElementById("myv").onclick = () => this.showValley();
    document.getElementById("sett").onclick = () => this.openSettings();
    /* ضغطة مطوّلة على زرّ الصوت: إعداد الصوت السحابي — للوالد لا للطفل */
    const snd = document.getElementById("snd");
    if (snd) {
      let t = null, x0 = 0, y0 = 0, fired = false;
      const start = e => {
        fired = false;
        const p = (e.touches && e.touches[0]) || e;
        x0 = p.clientX || 0; y0 = p.clientY || 0;
        t = setTimeout(() => { fired = true; snd.style.transform = ""; this.voiceSetup(); }, 700);
        snd.style.transform = "scale(.9)";
      };
      const stop = () => { clearTimeout(t); snd.style.transform = ""; };
      const move = e => {                       // تُلغى فقط عند حركةٍ حقيقية
        const p = (e.touches && e.touches[0]) || e;
        if (Math.abs((p.clientX || 0) - x0) > 18 || Math.abs((p.clientY || 0) - y0) > 18) stop();
      };
      snd.addEventListener("touchstart", start, { passive: true });
      snd.addEventListener("mousedown", start);
      snd.addEventListener("touchmove", move, { passive: true });
      ["touchend","touchcancel","mouseup","mouseleave"].forEach(ev =>
        snd.addEventListener(ev, stop, { passive: true }));
      /* لا يُبدَّل كتم الصوت إن كانت الضغطة مطوّلة */
      snd.addEventListener("click", e => { if (fired) { e.stopPropagation(); e.preventDefault(); } }, true);
    }

    /* ═══ ٢ · رابط مباشر: …/athar.html#voice ═══ */
    const openByHash = () => {
      if (location.hash === "#voice") { location.hash = ""; setTimeout(() => this.voiceSetup(), 400); }
    };
    addEventListener("hashchange", openByHash);
    setTimeout(openByHash, 1500);
    Director.init({ panel: document.getElementById("panel"), world: World });
    World.phase(State.data.phase || 0);
    this.paint();

      setTimeout(() => this.noVoiceNote(), 1200);
      setTimeout(() => this.offerDaily(), 3600);
    }, 900);

  /* ═══ التمهيد ═══

  intro(i) {
    const P = [
      { t: "هذا واديك", p: "أنا أثر، ورفيقك هنا. والوادي ينتظرك." },
      { t: "في كل مكانٍ درس", p: "بيتك، وطريقك، ونبعك، ومسجدك. تدخل المكان فتتعلّم فيه." },
      { t: "وما تتعلّمه… يترك أثرًا", p: "بعد كل درسٍ مهمّةٌ تفعلها خارج الشاشة. وحين تفعلها، يتغيّر شيءٌ في واديك." }
    ];
    const host = document.getElementById("intro");
    if (i >= P.length) {
      host.classList.remove("on");
      State.data.intro = true; State.save();
      World.athar("app.welcome", "hi", 3400);
      this.paint();
      setTimeout(() => this.offerDaily(), 3600);
      return;
    }
    const c = P[i];
    host.innerHTML = `<div class="icard">
      <div class="idots">${P.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <h3>${c.t}</h3><p>${c.p}</p>
      <button class="ibtn">${i === P.length - 1 ? "هيّا نبدأ" : "التالي"}</button></div>`;
    host.classList.add("on");
    AtharAudio.bindReadable(host);
    AtharAudio.say("intro." + (i + 1));
    host.querySelector(".ibtn").onclick = () => { AtharAudio.sfx("tap"); this.intro(i + 1); };
  },

  /* ═══ إعداد الصوت السحابي ═══
     للوالد: يُلصق مفتاحًا مرّة، فيعمل الصوت على كل جهاز بلا محرّك نطق. */
  voiceSetup() {
    const host = document.getElementById("nextup");
    const cur = AtharAudio.getKey();
    host.innerHTML = `<div class="ncard">
      <div class="ntag">إعداد الصوت — للوالد</div>
      <p class="ngoal" style="font-size:15px">جهازك بلا محرّك نطق. الصق مفتاح Google TTS ليعمل الصوت على كل جهاز.</p>
      <input id="kbox" type="text" placeholder="AIza..." value="${cur}"
        style="width:100%;margin-top:11px;padding:13px;border:3px solid #DCCDAE;border-radius:14px;
        font:inherit;font-size:15px;direction:ltr;text-align:left">
      <div id="kmsg" style="font-size:14px;margin-top:8px;min-height:20px"></div>
      <button class="nbtn" id="ktest">جرّب واحفظ</button>
      <button class="nghost" id="kclose">إغلاق</button></div>`;
    host.classList.add("on");
    const msg = host.querySelector("#kmsg");
    host.querySelector("#kclose").onclick = () => host.classList.remove("on");
    host.querySelector("#ktest").onclick = async () => {
      const k = host.querySelector("#kbox").value.trim();
      if (!k) { AtharAudio.setKey(""); msg.textContent = "أُزيل المفتاح."; return; }
      msg.textContent = "يُجرَّب الآن…"; msg.style.color = "#7A6B55";
      const r = await AtharAudio.testKey(k);
      if (r.ok) {
        AtharAudio.setKey(k);
        msg.textContent = "✓ يعمل — سمعتَ أثر الآن. حُفظ المفتاح.";
        msg.style.color = "#2F6B3E";
        setTimeout(() => host.classList.remove("on"), 2200);
      } else {
        msg.textContent = "✗ لم ينجح: " + r.err;
        msg.style.color = "#B85C78";
      }
    };
  },

  /* ═══ واديي ═══
     ما صنعتَه في وادينا. كل علامةٍ عملٌ فعلتَه، لا نقطةٌ جمعتَها. */
  showValley() {
    const host = document.getElementById("valley");
    const all = Object.values(this.exps);
    const mine = all.filter(e => State.hasMark(e.leaves));
    const rest = all.filter(e => !State.hasMark(e.leaves) && e.stage <= this.stage());
    const M = root.MARKS || {};
    const kept = Object.values(State.data.depth || {}).reduce((s, n) => s + n, 0);
    host.innerHTML = `<div class="vcard">
      <div class="vtag">واديي</div>

      <div class="vlist">${mine.map(e =>
        `<div class="vrow"><b>${M[e.leaves] || ""}</b><i>${I18n.txt(e.title)}</i></div>`).join("")

  /* ═══ لوحة الوالد ═══

  _parentAnswer: 0,
  openParentGate() {
    const host = document.getElementById("parent");
    const a = 2 + Math.floor(Math.random() * 8), b = 2 + Math.floor(Math.random() * 8);
    this._parentAnswer = a + b;
    host.innerHTML = `<div class="pcard pgate">

  actOf(exp) { return (exp.beats || []).find(b => b.type === "act") || null; },

        World.athar(lvl > 1 ? "daily.again" : "daily.done", "joy", 3600);
        this.renderDaily(exp, true);
        setTimeout(() => host.classList.remove("on"), 4200);
      };
    }
    host.onclick = e => { if (e.target === host) host.classList.remove("on"); };
  },

  /* العالم يعرض نفسه — لا قوائم ولا أسماء أقسام */
  paint() {
    World.render(this.places, p => this.open(p), p => this.status(p));
    const nxt = this.places.find(p => this.nextAt(p));
    if (nxt) World.moveTo(nxt.place);
    this.labels();
    if (State.noteStage(this.stage())) {
      const s = this.stage();
      setTimeout(() => this.stageUp(s), 800);
      setTimeout(() => this.labels(), 2600);
    }
    this.guideWorld(nxt);
  },

  /* في القرية أيضًا: إن سكن الطفل، دلّه العالم ثم أثر */
  guideWorld(nxt) {
    Guide.clear();
    if (!nxt) {                       /* تمّ اليوم كلّه */
      World.phase(2);
      setTimeout(() => World.athar("athar.dayDone", "joy", 4200), 1400);
      return;
    }
    setTimeout(() => {
      if (document.getElementById("panel").classList.contains("up")) return;
      Guide.watch(document.getElementById("app"), ".plabel.ready", "hint.where");
    }, 1200);
  },

  labels() {
    const lay = document.getElementById("labels");
    lay.innerHTML = "";
    const svg = document.querySelector("#scene");
    const box = svg.getBoundingClientRect();
    this.places.forEach(p => {
      const g = svg.querySelector(`.place[data-place="${p.place}"] .halo`);
      if (!g || !this.visible(p)) return;
      const nx = this.nextAt(p);
      const open = !!nx || this.anyDone(p);
      const done = !nx && this.anyDone(p);
      const pt = svg.createSVGPoint();
      pt.x = +g.getAttribute("cx"); pt.y = +g.getAttribute("cy") + (+g.getAttribute("r"));
      const s = pt.matrixTransform(svg.getScreenCTM());
      const d = document.createElement("div");
      d.className = "plabel" + (open ? (done ? " done" : " ready") : " sleep");
      d.style.left = (s.x - box.left) + "px";
      d.style.top = (s.y - box.top) + "px";
      d.textContent = open ? I18n.txt(p.label) : "";
      if (open) d.onclick = () => this.open(p);
      lay.append(d);
    });
  },

  /* أول تجربة متاحة في هذا المكان — هكذا ينمو المكان بلا مبانٍ جديدة */
  nextAt(p) {
    const s = this.stage();
    for (const id of (p.exps || [])) {
      const e = this.exps[id];
      if (e && !State.isLearned(id) && e.stage <= s) return e;
    }
    return null;
  },
  stage() { return State.stage(Object.values(this.exps)); },
  /* المكان يظهر في الوادي فقط إن كان فيه درسٌ لمرحلة الطفل.
     فالوادي يتّسع كلّما كبر — بلا تصميمٍ جديد لكل مرحلة. */
  visible(p) {
    const s = this.stage();
    return (p.exps || []).some(id => (this.exps[id] || {}).stage <= s);
  },
  anyDone(p) { return (p.exps || []).some(id => State.isLearned(id)); },

  /* حالة المكان: أظاهرٌ في مرحلته؟ أمفتوحٌ الآن؟ أأُتمّ؟ */
  status(p) {
    const nx = this.nextAt(p), done = this.anyDone(p);
    return { here: this.visible(p), open: !!nx || done, done: !nx && done };
  },

  /* إعادة ما تعلّمه — التكرار مبدأ، لا نقص */
  lastAt(p) {
    const done = (p.exps || []).filter(id => State.isLearned(id));
    return done.length ? this.exps[done[done.length - 1]] : null;
  },

  /* أين الدرس التالي؟ — أوّل مكانٍ فيه درسٌ متاح */
  nextLesson() {
    for (const p of this.places) {
      const e = this.nextAt(p);
      if (e) return { exp: e, place: p };
    }
    return null;
  },

  /* بلوغ مرحلة: يُقال له ماذا انفتح له */
  stageUp(s) {
    const NAMES = { 2:"الثانية", 3:"الثالثة", 4:"الرابعة" };
    const PL = { home:"بيتي", road:"الطريق", spring:"النبع", hill:"التلّة", masjid:"مسجدي" };
    const opened = this.places.filter(p => this.visible(p) &&
      (p.exps || []).some(id => (this.exps[id] || {}).stage === s));
    const host = document.getElementById("nextup");
    host.innerHTML = `<div class="ncard done">
      <div class="ntag">كبرتَ</div>
      <h3>بلغتَ المرحلة ${NAMES[s] || ""}</h3>
      <p class="ngoal">أتممتَ مرحلتك كلّها، فاتّسع وادينا.</p>
      ${opened.length ? `<div class="nleft">وانفتح لك: ${opened.map(p => PL[p.place]).join(" · ")}</div>` : ""}
      <button class="nbtn">انظر</button></div>`;
    host.classList.add("on");
    AtharAudio.bindReadable(host);
    World.athar("stage." + s, "wow", 4200);
    host.querySelector(".nbtn").onclick = () => {
      AtharAudio.sfx("up"); host.classList.remove("on");
      setTimeout(() => this.showNext(), 700);
    };
  },

  /* ═══ ماذا بعد ═══
     لا يُترك الطفل واقفًا بعد إنجاز درس. يُقال له: التالي هنا. */
  showNext() {
    const host = document.getElementById("nextup");
    const n = this.nextLesson();
    const s = this.stage();
    const left = Object.values(this.exps).filter(e => e.stage === s && !State.isLearned(e.id)).length;

    if (!n) {
      host.innerHTML = `<div class="ncard done">
        <div class="ntag">تمّ الوادي كلّه</div>
        <p>أتممتَ كل الدروس. وواديك صار كما تراه.</p>
        <button class="nbtn">انظر إلى واديك</button></div>`;
      host.classList.add("on");
      host.querySelector(".nbtn").onclick = () => {
        host.classList.remove("on"); this.showValley();
      };
      return;
    }
    const PL = { home:"بيتي", road:"الطريق", spring:"النبع", hill:"التلّة", masjid:"مسجدي" };
    host.innerHTML = `<div class="ncard">
      <div class="ntag">التالي</div>
      <h3>${I18n.txt(n.exp.title)}</h3>
      <p class="nwhere">في ${PL[n.place.place] || ""}</p>
      <p class="ngoal">${I18n.txt(n.exp.goal)}</p>
      ${left > 1 ? `<div class="nleft">وبقي ${left === 2 ? "درسٌ آخر" : left - 1 + " دروسٍ"} في مرحلتك</div>` : ""}
      <button class="nbtn">اذهب</button>
      <button class="nghost">أتجوّل في وادي</button></div>`;
    host.classList.add("on");
    AtharAudio.bindReadable(host);
    World.moveTo(n.place.place);
    World.athar("next.here", "hi", 3000);
    host.querySelector(".nbtn").onclick = () => {
      AtharAudio.sfx("tap"); host.classList.remove("on"); this.open(n.place);
    };
    host.querySelector(".nghost").onclick = () => {
      AtharAudio.sfx("soft"); host.classList.remove("on");
    };
  },

  open(p) {
    const exp = this.nextAt(p) || this.lastAt(p);
    if (!exp) return;
    const again = !this.nextAt(p);
    Guide.clear();
    World.hush();
    World.moveTo(p.place);
    if (exp.phase != null) World.phase(exp.phase);
    if (again) World.athar("athar.again", "hi", 2200);
    setTimeout(() => Director.run(exp, done => {
      this.paint();
      if (done) setTimeout(() => this.showNext(), 900);
    }), again ? 1600 : 700);
  }
};

root.App = App;
addEventListener("resize", () => App.places.length && App.labels());
})(window);

</script>

م لأعمالٍ مخصوصة، وأركانه أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي بين الصفا والمروة."},"src.sawm.sunan":{"voice":"sacred","text":"من سنن الصيام: تعجيل الفطر، والسحور وتأخيره، والزيادة في أعمال الخير والعبادة، وقول الصائم إذا شُتم: «إنّي صائم»، والدعاء عند الفطر، والفطر على رطبٍ أو تمر فإن لم يجد فعلى ماء.","ref":"ص ٢٥"},"src.sawm.fadl":{"voice":"sacred","text":"عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله ﷺ: «ما من عبدٍ يصوم يومًا في سبيل الله، إلا باعد الله بذلك اليوم وجهه عن النار سبعين خريفًا». ومعنى «سبعين خريفًا» أي: سبعين سنة.","ref":"متفق عليه — ص ٢٥"},"src.hajj.def":{"voice":"sacred","text":"الحجّ: هو التعبّد لله تَعَالَى بقصد بيته الحرام لأعمالٍ مخصوصة في وقتٍ مخصوص. وأركانه: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي بين الصفا والمروة.","ref":"ص ٢٥"},"src.hajj.hadith":{"voice":"sacred","text":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «من حجّ للهِ فلم يرفُثْ ولم يفسُقْ، رجع كيوم ولدته أمّه». أي: بغير ذنب.","ref":"رواه البخاري — ص ٢٥"},"athar.hubb.open":{"voice":"athar","text":"ميزانٌ واحد… يكفيك مع كل الناس"},"athar.hubb.trees":{"voice":"athar","text":"نبتت شجرتان متجاورتان"},"q.hubb.prize":{"voice":"narrator","text":"ماذا يقول قلبك؟"},"sit.hubb":{"voice":"narrator","text":"فاز صاحبك بجائزةٍ كنتَ تتمنّاها أنت."},"out.hubb.envy":{"voice":"narrator","text":"وهل تحبّ أن يقول أحدٌ هذا عنك إذا فزتَ أنت؟"},"out.hubb.joy":{"voice":"narrator","text":"وهذا من كمال الإيمان."},"q.hubb.benefits":{"voice":"narrator","text":"فائدتان من الحديث."},"rev.hubb.1":{"voice":"narrator","text":"على المؤمن أن يحبّ للمؤمنين من الخير كما يحبّ لنفسه."},"rev.hubb.2":{"voice":"narrator","text":"وذلك من كمال الإيمان."},"tad.hadith.hubb":{"voice":"narrator","text":"ميزانٌ واحد يكفيك عمرك كلّه: ما أحببتَه لنفسك، أحبّه لأخيك."},"act.hubb":{"voice":"narrator","text":"افرح اليوم لأحدٍ نال خيرًا، وادعُ له في نفسك."},"goal.hadith.hubb":{"voice":"narrator","text":"سنعرف ميزانًا واحدًا نقيس به معاملتنا لكل الناس."},"end.hadith.hubb":{"voice":"narrator","text":" arrator","text":"قال: أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي."},"q.ghi.toy":{"voice":"narrator","text":"ماذا تفعل؟"},"sit.ghi":{"voice":"narrator","text":"تبيع لعبةً لصاحبك، وفيها كسرٌ صغير من الأسفل لا يظهر."},"out.ghi.hide":{"voice":"narrator","text":"وإخفاء العيب غشّ، ولو لم يسأل. ومن غشّ فليس منّي."},"out.ghi.show":{"voice":"narrator","text":"أحسنت، جعلتَ العيب فوق الطعام كي يراه."},"tad.akhlaq.ghish":{"voice":"narrator","text":"أخفيتَه عن عين الناس، ويدُ الله فوق الكومة تعلم ما تحتها."},"act.ghi":{"voice":"narrator","text":"إذا أعطيتَ أحدًا شيئًا اليوم، فأخبره بعيبه قبل أن يسأل."},"goal.akhlaq.ghish":{"voice":"narrator","text":"سنعرف ما الغشّ، ولماذا يُخرج صاحبه من دائرة النبي صلى الله عليه وسلم."},"end.akhlaq.ghish":{"voice":"narrator","text":"تعلّمتَ اليوم: الغشّ ومنه إخفاء عيب السلعة، وقال النبي صلى الله عليه وسلم: من غشّ فليس منّي."},"src.man.list":{"voice":"sacred","text":"سبحان الله: التسبيح، وهو تنزيهه سُبْحَانَهُ وَتَعَالَى عن كل نقصٍ وعيبٍ وسوء. الحمد لله: هو الثناء على الله تَعَالَى، ووصفه بكل صفات الكمال. الله أكبر: أي إنّه سُبْحَانَهُ أكبر من كل شيء وأجلّ وأعظم وأعزّ من كل شيء. لا حول ولا قوّة إلا بالله: معناها لا تحوُّل للعبد من حالٍ إلى حال، ولا قوّة له على ذلك إلا بالله.","ref":"ص ٨١"},"src.tawb.ayah":{"voice":"sacred","text":"التوبة: هي الرجوع عن معصية الله تَعَالَى إلى طاعته. قال تَعَالَى: ﴿وَإِنِّي لَغَفَّارٌ لِّمَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ﴾. وأستغفر الله: أي أطلب المغفرة من الله.","ref":"طه: ٨٢ — ص ٨١ و ٨٢"},"src.nim.ayah":{"voice":"sacred","text":"من نعم الله عليك: نعمة الإسلام وأنّك لستَ من أهل الكفر، ونعمة السنّة وأنّك لستَ من أهل البدع، ونعمة الصحّة والعافية من السمع والبصر والمشي وغيرها، ونعمة الطعام والشراب والملبس. قال تَعَالَى: ﴿وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا﴾","ref":"النحل: ١٨ — ص ٧٩"},"src.nim.shukr":{"voice":"sacred","text":"الواجب في النعم: شكرها، وذلك بالثناء على الله وحمده باللسان، وأنّه له الفضل وحده، واستعمال هذه النعم بما يرضي الله تَعَالَى لا بمعصيته. قال تَعَالَى: ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾","ref":"البقرة: ١٥٢ — ص ٧٩"},"src.dua.ayah":{"voice":"sacred","text":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى: ﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾. وقال النبي ﷺ: «الدعاءُ هو العبادة».","ref":"غافر: ٦٠ · رواه أبو داود والترمذي وابن ماجه — ص ٨١"},"src.ghi.hadith":{"voice":"sacred","text":"عن أبي هريرة رضي الله عنه، أنّ رسول الله ﷺ مرّ على صُبرة طعام، فأدخل يده فيها، فنالت أصابعه بللًا، فقال: «ما هذا يا صاحب الطعام؟» قال: أصابته السماء يا رسول الله. قال: «أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي».","ref":"رواه مسلم — ص ٧٩"},"athar.mub.open":{"voice":"athar","text":"حين ترى من ابتُلي بشيء…"},"athar.mub.shelter":{"voice":"athar","text":"ارتفع ظلٌّ يستر وادينا"},"q.mub.see":{"voice":"narrator","text":"ماذا تفعل؟"},"sit.mub":{"voice":"narrator","text":"رأيتَ ولدًا لا يستطيع المشي كما تمشي أنت، ونظر إليك."},"out.mub.stare":{"voice":"narrator","text":"وأنت لا تدري: لعلّه أقرب إلى الله منك، وابتلاؤه رفعةٌ له."},"out.mub.kind":{"voice":"narrator","text":"أحسنت، وتقولها في نفسك لا تُسمعه إيّاها فتؤذيه."},"q.mub.more":{"voice":"narrator","text":"وأذكارٌ أخرى لمواقف تمرّ بك."},"rev.mub.1":{"voice":"narrator","text":"تقول: سبحان الذي يُسبّح الرعد بحمده، والملائكة من خيفته."},"rev.mub.2":{"voice":"narrator","text":"إذا رأى أحدكم من أخيه أو من نفسه أو من ماله ما يعجبه، فليدعُ له بالبركة."},"tad.adhkar.mubtala":{"voice":"narrator","text":"عافيتُك ليست لأنّك أفضل، بل لأنّ الله تفضّل. فاحمده، ولا تفخر."},"act.mub":{"voice":"narrator","text":"إن رأيتَ اليوم مبتلًى، فأحسِن إليه ولا تُشعره بشيء، واحمد الله في نفسك."},"goal.adhkar.mubtala":{"voice":"narrator","text":"سنتعلّم ماذا نقول وماذا لا نفعل حين نرى من ابتُلي بشيء."},"end.adhkar.mubtala":{"voice":"narrator","text":"تعلّمتَ اليوم: إذا رأيتَ مبتلًى قلتَ الحمد لله الذي عافاني ممّا ابتلاك به وفضّلني على كثيرٍ ممّن خلق تفضيلًا، وتقولها في نفسك."},"athar.sal.open":{"voice":"athar","text":"كيف نُهدي سلامنا لنبيّنا؟"},"athar.sal.crown":{"voice uallim_128kbps/101008.mp3"},"src.mub.dua":{"voice":"sacred","text":"الدعاء إذا رأيت مبتلًى: «الحمد لله الذي عافاني ممّا ابتلاك به، وفضّلني على كثيرٍ ممّن خلق تفضيلًا».","ref":"رواه الترمذي — ص ٧٦"},"src.sal.sigha":{"voice":"sacred","text":"«اللهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ».","ref":"متفق عليه — ص ٧٦"},"src.qar.full":{"voice":"sacred","text":"سورة القارعة: يوم يكون الناس كالفراش المبثوث، وتكون الجبال كالعهن المنفوش، فأمّا من ثقلت موازينه فهو في عيشةٍ راضية، وأمّا من خفّت موازينه فأمّه هاوية، وما أدراك ما هيه، نارٌ حامية.","ref":"القارعة: ١–١١ — ص ٣٤"},"src.has.hadith":{"voice":"sacred","text":"في الحديث: «إذا رأى أحدُكم من أخيه، أو من نفسه، أو من ماله ما يعجبه، فليدعُ له بالبركة، فإنّ العينَ حقّ».","ref":"رواه أحمد وابن ماجه — ص ٧٦"},"src.ras.ayah":{"voice":"sacred","text":"الأدب مع الرسول ﷺ: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة. قال تَعَالَى: ﴿مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ﴾. وقال سبحانه: ﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ ٣ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ ٤﴾","ref":"النساء: ٨٠ · النجم: ٣–٤ — ص ٤٨"},"athar.ahk.open":{"voice":"athar","text":"كلّ فعلٍ تفعله… له لونٌ من خمسة"},"athar.ahk.prism":{"voice":"athar","text":"انكسر الضوء ألوانًا"},"q.ahk.five":{"voice":"narrator","text":"خمسة أحكام. المس كلًّا لتعرف أثره."},"rev.ahk.1":{"voice":"narrator","text":"ما هو على وجه اللزوم، مثل الصلوات الخمس وصيام رمضان وبرّ الوالدين. يُثاب فاعله ويُعاقب تاركه."},"rev.ahk.2":{"voice":"narrator","text":"ما ليس على وجه اللزوم، مثل السنن الرواتب وقيام الليل وإطعام الطعام والسلام. يُثاب فاعله ولا يُعاقب تاركه."},"rev.ahk.3":{"voice":"narrator","text":"ما تركه لازم، مثل ترك الصلاة وشرب الخمر وعقوق الوالدين وقطع الأرحام. يُثاب تاركه ويُعاقب فاعله."},"rev.ahk.4":{"voice":"narrator","text":"تركه غير لازم، مثل الأخذ والإعطاء باليد الشمال، وكفّ الثوب في الصلاة. يُثاب تاركه ولا يُعاقب فاعله."},"rev.ahk.5":{"voice":"narrator","text":"وهو على التخيير بين تركه وفعله، مثل أكل التفاحة وشرب الشاي. لا يُثاب تاركه ولا يُعاقب فاعله."},"q.ahk.which":{"voice":"narrator","text":"ما حكم هذا؟"},"sit.ahk":{"voice":"narrator","text":"صاحبك يتركُ صلاةَ الفجر أحيانًا ويقول: هي مستحبّة كقيام الليل."},"out.ahk.wrong":{"voice":"narrator","text":"الصلوات الخمس واجبة يُعاقب تاركها. وقيام الليل مستحبّ لا يُعاقب تاركه. فرقٌ كبير."},"out.ahk.right":{"voice":"narrator","text":"أحسنت، الواجب يُعاقب تاركه، والمستحبّ لا."},"n.ahk.badir":{"voice":"narrator","text":"وينبغي للمسلم إذا سمع أنّ هذا الأمر سنّةٌ أو مستحبّ أن يبادر إلى فعله، والاقتداء بالنبي صلى الله عليه وسلم."},"tad.misc.ahkam":{"voice":"narrator","text":"خمسة ألوانٍ تفرز بها كلّ فعلٍ في عمرك، فلا تقف حائرًا بعد اليوم."},"act.ahk":{"voice":"narrator","text":"اختر ثلاثة أفعالٍ من يومك، واسأل أباك: ما حكم كلٍّ منها؟"},"goal.misc.ahkam":{"voice":"narrator","text":"سنعرف الأحكام الخمسة التي يُصنَّف بها كل فعل."},"end.misc.ahkam":{"voice":"narrator","text":"تعلّمتَ اليوم: الواجب يُثاب فاعله ويُعاقب تاركه، والمستحبّ يُثاب فاعله ولا يُعاقب تاركه، والمحرّم يُثاب تاركه ويُعاقب فاعله، والمكروه يُثاب تاركه ولا يُعاقب فاعله، والمباح لا هذا ولا ذاك."},"athar.fiq.open":{"voice":"athar","text":"لماذا نتعلّم ديننا؟"},"athar.fiq.lamp":{"voice":"athar","text":"أُضيء مصباحٌ فوق كتاب"},"q.fiq.touch":{"voice":"narrator","text":"ماذا يُصلح فيك التفقّه؟ المس لتعرف."},"rev.fiq.1":{"voice":"narrator","text":"صحّة الأقوال: فتعرف ما تقوله، ولا تتكلّم في دين الله بجهل."},"rev.fiq.2":{"voice":"narrator","text":"صحّة الأعمال: فتعبد الله كما أمر، لا كما تظنّ."},"rev.fiq.3":{"voice":"narrator","text":"صحّة الاعتقادات: فتعرف ربّك بأسمائه وصفاته كما يليق به."},"q.fiq.ask":{"voice":"narrator","text":"ماذا تفعل؟"},"sit.fiq":{"voice":"narrator","text":"مرّ بك سؤالٌ في دينك لم تعرف جوابه، وأنت مشغولٌ بلعبةٍ تحبّها."},"out.fiq.la r","text":"حين تبيع أو تشتري… ما الذي يجوز؟"},"athar.bay.coin":{"voice":"athar","text":"لمع دينارٌ في وادينا"},"q.bay.three":{"voice":"narrator","text":"ثلاثةٌ حُرّمت من المعاملات. اكتشفها."},"rev.bay.1":{"voice":"narrator","text":"الغشّ، ومنه: إخفاء عيب السلعة. قال النبي صلى الله عليه وسلم: من غشّ فليس منّي."},"rev.bay.2":{"voice":"narrator","text":"الربا، ومنه أن تأخذ ألفًا من إنسانٍ دينًا على أن تردّها إليه ألفين. والزيادة هي الربا المحرّم."},"rev.bay.3":{"voice":"narrator","text":"الغرر والجهالة: كأن يبيعك الحليب في ضرع الشاة، أو السمكة في الماء ولم تُصطد بعد."},"q.bay.deal":{"voice":"narrator","text":"ماذا تقول له؟"},"sit.bay":{"voice":"narrator","text":"قال لك صاحبك: أُعيرك عشرة ريالات، تردّها لي خمسة عشر بعد شهر."},"out.bay.riba":{"voice":"narrator","text":"وهذه الزيادة هي الربا المحرّم. وأحلّ الله البيع وحرّم الربا."},"out.bay.clean":{"voice":"narrator","text":"أحسنت، الدَّين يُردّ بمثله بلا زيادة."},"tad.misc.bay":{"voice":"narrator","text":"كلّ شيءٍ حلالٌ لك إلا القليل، فلماذا تذهب إلى القليل وتترك الكثير؟"},"act.bay":{"voice":"narrator","text":"إن بعتَ أو اشتريتَ اليوم، فبيّن العيب ولا تأخذ زيادةً على دَين."},"goal.misc.bay":{"voice":"narrator","text":"سنعرف أنّ الأصل في البيع الحِلّ، وما الذي حُرّم منه."},"end.misc.bay":{"voice":"narrator","text":"تعلّمتَ اليوم: الأصل في البيوع والمعاملات الحِلّ إلا ما حرّم الله، ومنه الغشّ والربا والغرر والجهالة."},"src.ahk.five":{"voice":"sacred","text":"الأحكام التكليفية خمسة: الواجب — يُثاب فاعله ويُعاقب تاركه. المستحبّ — يُثاب فاعله ولا يُعاقب تاركه، ويسمّى السنّة والمندوب. المحرّم — يُثاب تاركه ويُعاقب فاعله. المكروه — يُثاب تاركه ولا يُعاقب فاعله. المباح — لا يُثاب تاركه ولا يُعاقب فاعله، ويسمّى الجائز والحلال.","ref":"ص ٧٨"},"src.fiq.hadith":{"voice":"sacred","text":"ثمرة التفقّه في الدين: صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة. وفي الحديث عن معاوية بن أبي سفيان رضي الله عنهما قال: قال رسول الله ﷺ: «من يُرد الله به خيرًا يُفقّهه في الدين». يُفقّهه: أي يجعله عالمًا بالأحكام الشرعية.","ref":"رواه البخاري ومسلم — ص ٧٨"},"src.ayy.eid":{"voice":"sacred","text":"أعياد المسلمين: عيد الفطر وعيد الأضحى. قَالَ رسول الله ﷺ لمّا قدم المدينة ولهم يومان يلعبون فيهما: «ما هذان اليومان؟» قالوا: كنّا نلعب فيهما في الجاهليّة. فقال ﷺ: «إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر». وما سواهما من الأعياد فمن البدع. وأفضل الشهور: شهر رمضان. وأفضل الأيّام: يوم الجمعة.","ref":"رواه أبو داود — ص ٧٩"},"src.bay.asl":{"voice":"sacred","text":"الأصل في كل البيوع والمعاملات أنها حلال، إلا بعض الأنواع ممّا حرّم الله تَعَالَى. قال تَعَالَى: ﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾","ref":"البقرة: ٢٧٥ — ص ٧٨"},"daily.offer":{"voice":"athar","text":"عندي لك مهمّةٌ اليوم"},"daily.done":{"voice":"athar","text":"تركتَ أثرًا جديدًا"},"daily.again":{"voice":"athar","text":"أثرُك يزداد عمقًا"},"athar.suj.open":{"voice":"athar","text":"حين تسجد… ماذا يلمس الأرض منك؟"},"athar.suj.seven":{"voice":"athar","text":"ظهرت سبع علاماتٍ في وادينا"},"q.suj.seven":{"voice":"narrator","text":"سبعة أعضاء تلمس الأرض. اجمعها."},"rev.suj.1":{"voice":"narrator","text":"الجبهة والأنف معًا، وهما عضوٌ واحد في العدّ."},"rev.suj.2":{"voice":"narrator","text":"الكفّان، اثنان."},"rev.suj.3":{"voice":"narrator","text":"والركبتان، اثنان."},"rev.suj.4":{"voice":"narrator","text":"وأطراف القدمين، اثنان. فذلك سبعة."},"q.suj.arms":{"voice":"narrator","text":"ما الصواب؟"},"sit.suj":{"voice":"narrator","text":"رأيتَ ولدًا يسجد وقد بسط ذراعيه كاملتين على الأرض."},"out.suj.ok":{"voice":"narrator","text":"وللسجود هيئة: يجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض."},"out.suj.right":{"voice":"narrator","text":"أحسنت، وهذه هي هيئة السجود."},"q.suj.order":{"voice":"narrator","text":"رتّب ما تقوله في سجودك وبين السجدتين."},"say.suj.1":{"voice":"narrator","text":"سبحان ربّي الأعلى"},"say.suj.2":{"voice":"narrator","text":"الله أكبر، أرفع رأسي"},"say.suj.3":{"voice":"narrator","text":"ربّ اغفر لي وارحمني واهدني"},"tad.ibadah.sujud":{"voice":"narrator","text":"أعلى ما فيك، جبهتُك، تضعها على التراب لله. فأيّ عزٍّ بعد هذا الذلّ؟"},"act.suj":{"voice":"narrator","text":"اسجد اليوم سجدةً على سبعة أعضاء، وقل فيها: سبحان ربّي الأعلى."},"goal.ibadah.sujud":{"voice":"narrator","text":"سنعرف على كم عضوٍ نسجد، وماذا نقول في السجود."},"end.ibadah.sujud":{"voice":"narrator","text":"تعلّمتَ اليوم: السجود على سبعة أعضاء: الجبهة والأنف والكفّان والركبتان وأطراف القدمين، وتقول سبحان ربّي الأعلى."},"athar.tash.open":{"voice":"athar","text":"وفي آخر صلاتك… جلسةٌ لها كلام"},"athar.tash.seat":{"voice":"athar","text":"اتّسع مجلسٌ في مسجدنا"},"q.tash.order":{"voice":"narrator","text":"رتّب أوّل التشهّد."},"say.tash.1":{"voice":"narrator","text":"التحيّات لله والصلوات والطيّبات"},"say.tash.2":{"voice":"narrator","text":"السلام عليك أيّها النبيّ ورحمة الله وبركاته"},"say.tash.3":{"voice":"narrator","text":"السلام علينا وعلى عباد الله الصالحين"},"say.tash.4":{"voice":"narrator","text":"أشهد أن لا إله إلا الله، وأشهد أنّ محمدًا عبده ورسوله"},"q.tash.four":{"voice":"narrator","text":"وأربعٌ تستعيذ منها قبل السلام. اكتشفها."},"rev.tash.1":{"voice":"narrator","text":"أعوذ بالله من عذاب جهنّم."},"rev.tash.2":{"voice":"narrator","text":"ومن عذاب القبر."},"rev.tash.3":{"voice":"narrator","text":"ومن فتنة المحيا والممات."},"rev.tash.4":{"voice":"narrator","text":"ومن فتنة المسيح الدجّال."},"tad.ibadah.tashahhud":{"voice":"narrator","text":"في كلّ صلاةٍ تُسلّم على نبيّك، وعلى كلّ عبدٍ صالحٍ في الأرض والسماء."},"act.tash":{"voice":"narrator","text":"استعذ اليوم بالأربع قبل سلامك، وأنت تفهم ما تستعيذ منه."},"goal.ibadah.tashahhud":{"voice":"narrator","text":"سنعرف ماذا نقول في التشهّد، وبمَ نستعيذ قبل السلام."},"end.ibadah.tashahhud":{"voice":"narrator","text":"تعلّمتَ اليوم: التحيّات لله والصلوات والطيّبات، ثم السلام على النبي وعلى عباد الله الصالحين، ثم الشهادتان، ثم تستعيذ من أربع."},"src.suj.seven":{"voice":"sacred","text":"ثم يسجد ويسجد على أعضائه السبعة: الجبهة والأنف، والكفّان، والركبتان، وأطراف القدمين. ويجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض، ويستقبل برؤوس أصابعه القبلة. ويقول ف ئه وصفاته.","ref":"النساء: ٤٨ — ص ٥"},"src.tym.how":{"voice":"sacred","text":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى: ﴿فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ﴾. وصفته: بضرب التراب ضربةً واحدة بباطن الكفّين، ومسح الوجه وظاهر الكفّين مرّةً واحدة.","ref":"النساء: ٤٣ — ص ١٦"},"src.raw.fadl":{"voice":"sacred","text":"السنن الرواتب: هي ثنتا عشرة ركعة في اليوم والليلة، من صلّاها بُني له بيتٌ في الجنّة. والعمرة: التعبّد لله تَعَالَى بالطواف بالبيت والسعي بين الصفا والمروة، وأركانها: الإحرام، والطواف، والسعي.","ref":"ص ٢٢ و ٢٦"},"athar.sah.open":{"voice":"athar","text":"من حملوا إليك هذا الدين"},"athar.sah.stars":{"voice":"athar","text":"أضاءت أربعة نجوم"},"q.sah.who":{"voice":"narrator","text":"من هو الصحابيّ؟ المس لتعرف."},"rev.sah.1":{"voice":"narrator","text":"هو من لقي النبيَّ صلى الله عليه وسلم مؤمنًا به، ومات على الإسلام."},"rev.sah.2":{"voice":"narrator","text":"يجب أن نحبّهم ونقتديَ بهم، وهم خير الناس وأفضلهم بعد الأنبياء."},"q.sah.four":{"voice":"narrator","text":"وأفضلهم الخلفاء الأربعة. رتّبهم."},"say.sah.1":{"voice":"narrator","text":"أبو بكر الصدّيق"},"say.sah.2":{"voice":"narrator","text":"عمر بن الخطّاب"},"say.sah.3":{"voice":"narrator","text":"عثمان بن عفّان"},"say.sah.4":{"voice":"narrator","text":"عليّ بن أبي طالب"},"q.sah.bad":{"voice":"narrator","text":"ماذا تقول؟"},"sit.sah":{"voice":"narrator","text":"سمعتَ من يتكلّم في أحد أصحاب النبي صلى الله عليه وسلم بكلامٍ سيّئ."},"out.sah.silent":{"voice":"narrator","text":"وقد رضي الله عنهم ورضوا عنه. ويجب أن نحبّهم ونقتديَ بهم."},"out.sah.defend":{"voice":"narrator","text":"أحسنت، فهم خير الناس بعد الأنبياء."},"tad.seerah.sahabah":{"voice":"narrator","text":"لولا أنّهم حفظوه لك، ما وصلك من دينك حرفٌ واحد."},"act.sah":{"voice":"narrator","text":"اعرف اليوم قصّةً واحدة عن صحابيّ، وأخبر بها أخاك."},"goal.seerah.sahabah":{"voice":"narrator","text":"سنعرف من هم الصحابة، ومن أفضلهم، وما واجبنا نحوهم."},"end.seera document.getElementById("snd").onclick = e => {

  if (!m) AtharAudio.sfx("tap");

App.boot(ATHAR_DATA);
</script>
<script>
/* ═══════════════ شريط أسفل الشاشة (تثبيت / تحديث) ═══════════════ */
function ubarShow(msg, btnText, onBtn, laterText, title) {
  const el = document.getElementById("ubar"); if (!el) return;
  el.innerHTML = "<span>" + (title ? "<b>" + title + "</b>" : "") + msg + "</span>" +
    (laterText ? '<button type="button" class="ghost" id="ubtn2">' + laterText + "</button>" : "") +
    (btnText ? '<button type="button" id="ubtn1">' + btnText + "</button>" : "");
  el.hidden = false;
  const b1 = document.getElementById("ubtn1"), b2 = document.getElementById("ubtn2");
  if (b1) b1.onclick = () => { el.hidden = true; onBtn && onBtn(); };
  if (b2) b2.onclick = () => { el.hidden = true; try { localStorage.setItem("athar.installOff", "1"); } catch {} };
}

/* ═══════════════ تثبيت التطبيق ═══════════════
   أندرويد/كروم يطلقان beforeinstallprompt فنعرض شريطًا بعد ٦ ثوانٍ.
   آيفون وماك-سفاري لا يدعمانه إطلاقًا، فالبديل إرشادٌ مكتوب. */
let deferredInstall = null;
let INSTALLED = false;

function isStandalone() {
  return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isMacSafari() {
  const u = navigator.userAgent;
  return /Macintosh/.test(u) && /Safari/.test(u) && !/Chrome|Chromium|Edg|OPR/.test(u);
}
function installDismissed() {
  try { return localStorage.getItem("athar.installOff") === "1"; } catch { return false; }
}

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstall = e;
  setTimeout(() => offerInstall(), 6000);
});
window.addEventListener("appinstalled", () => {
  deferredInstall = null; INSTALLED = true;
  document.getElementById("ubar").hidden = true;
});
matchMedia("(display-mode: standalone)").addEventListener("change", e => { if (e.matches) INSTALLED = true; });

function offerInstall() {
  if (INSTALLED || isStandalone() || installDismissed()) return;
  if (deferredInstall) {
    ubarShow("ثبّت أثر على شاشتك ليفتح مباشرة ويعمل أسرع", "تثبيت", runInstall, "لاحقًا");
    return;
  }
  if (isIOS()) {
    ubarShow('اضغط زر المشاركة أسفل الشاشة، ثم اختر «إضافة إلى الشاشة الرئيسية»', null, null, "تم", "ثبّت أثر على آيفون");
    return;
  }
  if (isMacSafari()) {
    ubarShow('من شريط سفاري اضغط زر المشاركة، ثم اختر «إضافة إلى Dock»', null, null, "تم", "ثبّت أثر على ماك");
  }
}
async function runInstall() {
  if (!deferredInstall) return;
  const p = deferredInstall; deferredInstall = null;
  try {
    p.prompt();
    const res = await p.userChoice;
    if (res && res.outcome === "dismissed") { try { localStorage.setItem("athar.installOff", "1"); } catch {} }
  } catch {}
}

/* ═══════════════ تحديث التطبيق ═══════════════
   لا نفرض إعادة التحميل، بل نعرض شريطًا يختار منه الوالد. */
function registerSW() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  navigator.serviceWorker.register("./sw.js").then(reg => {
    if (reg.waiting) offerUpdate(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) offerUpdate(w);
      });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return; reloading = true; location.reload();
  });
  function offerUpdate(worker) {
    ubarShow("تتوفّر نسخة جديدة من أثر", "تحديث", () => worker.postMessage({ type: "SKIP_WAITING" }), "لاحقًا");
  }
}

INSTALLED = isStandalone();
window.addEventListener("load", () => {
  registerSW();
  setTimeout(() => { if (!deferredInstall) offerInstall(); }, 8000);
});
</script>
